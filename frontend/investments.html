<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Balance - Investimentos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Portfolio Balance</h1>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="allocations.html">Alocações</a>
                <a href="investments.html" class="active">Investimentos</a>
                <a href="calculator.html">Calculadora</a>
            </nav>
        </header>

        <main>
            <section class="investments-section">
                <h2>Gerenciar Investimentos</h2>

                <div class="actions">
                    <button id="addInvestmentBtn" class="btn btn-primary">Adicionar Investimento</button>
                </div>

                <div class="filter-section">
                    <label for="typeFilter">Filtrar por tipo:</label>
                    <select id="typeFilter">
                        <option value="">Todos</option>
                    </select>
                </div>

                <div id="investmentsList" class="investments-table">
                    <!-- Investments table will be inserted here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal for adding/editing investment -->
    <div id="investmentModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Adicionar Investimento</h2>
            <form id="investmentForm">
                <input type="hidden" id="investmentId">

                <div class="form-group">
                    <label for="investmentType">Tipo de Investimento*</label>
                    <select id="investmentType" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="investmentName">Nome*</label>
                    <input type="text" id="investmentName" required>
                </div>

                <div class="form-group">
                    <label for="investmentValue">Valor Atual*</label>
                    <input type="number" id="investmentValue" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="investmentWeight">Peso*</label>
                    <input type="number" id="investmentWeight" step="0.01" min="0.01" value="1" required>
                    <small>O peso determina a proporção de alocação dentro do tipo de investimento</small>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/investments.js"></script>
</body>
</html>
