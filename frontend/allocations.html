<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQ2GXQ32SJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-KQ2GXQ32SJ');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6601883419056823"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Balance - Alocações</title>
    <link rel="stylesheet" href="css/styles.css">
    <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
    </script>
</head>
<body>
    <amp-auto-ads type="adsense"
        data-ad-client="ca-pub-6601883419056823">
    </amp-auto-ads>
    <div class="container">
        <header>
            <h1>Portfolio Balance</h1>
            <button class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav>
                <a href="index.html">Dashboard</a>
                <div class="nav-item">
                    <a>Portfólio</a>
                    <div class="dropdown-menu">
                        <a href="allocations.html" class="active">Alocações</a>
                        <a href="investments.html">Investimentos</a>
                        <a href="transactions.html">Transações</a>
                        <a href="history.html">Histórico</a>
                    </div>
                </div>
                <div class="nav-item">
                    <a>Calculadoras</a>
                    <div class="dropdown-menu">
                        <a href="compound-interest.html">Juros Compostos</a>
                        <a href="fire-tradicional.html">FIRE Tradicional</a>
                    </div>
                </div>
                <a href="calculator.html">Novo Aporte</a>
                <a href="profitability.html">Rentabilidade</a>
                <div class="user-menu">
                    <span id="username"></span>
                    <button onclick="logout()" class="btn-logout">Sair</button>
                </div>
            </nav>
        </header>

        <main>
            <section class="allocations-section">
                <h2>Metas</h2>
                <p class="description">Edite os itens abaixo para ajustar suas metas.</p>

                <form id="allocationsForm">
                    <div class="allocations-container">
                        <!-- Left side: Pie Chart -->
                        <div class="chart-container">
                            <div class="chart-wrapper">
                                <canvas id="pieChart" width="350" height="350"></canvas>
                                <div class="chart-total">
                                    <div class="total-label">Total:</div>
                                    <div class="total-value"><span id="totalAllocation">0</span>%</div>
                                </div>
                            </div>
                            <div class="chart-legend" id="chartLegend">
                                <!-- Legend will be inserted here -->
                            </div>
                        </div>

                        <!-- Right side: Sliders -->
                        <div class="sliders-container">
                            <div id="allocationInputs" class="allocation-inputs">
                                <!-- Allocation sliders will be inserted here -->
                            </div>
                        </div>
                    </div>

                    <div class="form-footer">
                        <button type="button" onclick="resetAllocations()" class="btn btn-secondary">Resetar valores</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>

                <div id="message" class="message"></div>
            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check authentication on page load
        checkAuth();

        // Display username
        const userInfo = getUserInfo();
        if (userInfo) {
            document.getElementById('username').textContent = userInfo.username;
        }
    </script>
    <script src="js/mobile-menu.js"></script>
    <script src="js/allocations.js"></script>
</body>
</html>
